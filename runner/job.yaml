# One manual SkillEval run: SkillEvaluator's live tier for one skill version and
# one pinned model. The controller creates the same Job per SkillEval (CONTRACT.md,
# "Runner Job contract"); the skill-eval-runner ServiceAccount and Role live in config/.
# Trials run as Agent Sandboxes in the same namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: skilleval-acme-release-notes-haiku
  namespace: skill-ci
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: skill-eval-runner
      restartPolicy: Never
      imagePullSecrets:
        - name: docr
      containers:
        - name: skill-eval
          image: registry.digitalocean.com/skill-ci-dirien/skill-ci-runner:0.6.0
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: SKILL_REF
              value: harbor.harbor.svc.cluster.local/skills/acme-release-notes:v1.0.0
            - name: SKILL_NAME
              value: acme-release-notes
            - name: AGENT
              value: claude-code
            - name: MODEL
              value: claude-haiku-5-5
            # Optional: the agent CLI release. Without it the runner pins its default for the agent.
            - name: AGENT_VERSION
              value: "2.1.292"
            - name: ATTEMPTS
              value: "1"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: anthropic
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: openai
                  optional: true
            # Optional keys of other agents (llm-keys: openai-base-url, nvidia, ollama, openrouter);
            # the controller adds all of them to the Jobs it creates, see CONTRACT.md "LLM keys".
          volumeMounts:
            - name: registry-auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: registry-auth
          secret:
            secretName: harbor-pull
            items:
              - key: .dockerconfigjson
                path: config.json
