# Template. Create the real Secret with the kubectl command in deploy/README.md, not by editing this file.
# Only `anthropic` is required (it is the judge of every run); the rest are optional.
apiVersion: v1
kind: Secret
metadata:
  name: llm-keys
  namespace: skill-ci
type: Opaque
stringData:
  anthropic: REPLACE_WITH_ANTHROPIC_API_KEY
  # openai: REPLACE_WITH_OPENAI_API_KEY             # Codex, Tier 2 embeddings
  # openai-base-url: https://api.openai.com/v1      # optional, this is the default
  # openrouter: REPLACE_WITH_OPENROUTER_API_KEY     # OpenCode models openrouter/...
  # ollama: REPLACE_WITH_OLLAMA_CLOUD_API_KEY       # OpenCode models ollama-cloud/...
  # nvidia: REPLACE_WITH_NVIDIA_API_KEY             # OpenCode models nvidia/...
