# Template. Registry config for oras pulls and pushes against the in-cluster Harbor (runner Jobs, toolbox).
# auth is base64("admin:<password>"): printf 'admin:%s' "$PASSWORD" | base64 | tr -d '\n'
apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull
  namespace: skill-ci
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"harbor.harbor.svc.cluster.local":{"username":"admin","password":"REPLACE_WITH_HARBOR_ADMIN_PASSWORD","auth":"REPLACE_WITH_BASE64_OF_admin:PASSWORD"}}}
