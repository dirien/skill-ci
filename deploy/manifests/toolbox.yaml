# Pushes skills from inside the cluster (Harbor is only reachable there). Used by demo/*.sh via kubectl exec.
# The image tags are set by the kustomization (generated by deploy/generate.sh from deploy/versions.env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: skill-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox
  template:
    metadata:
      labels:
        app: toolbox
      annotations:
        kubectl.kubernetes.io/default-container: oras
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: oras
          image: ghcr.io/oras-project/oras
          command: ["sleep", "2147483647"]
          workingDir: /workspace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: harbor-pull
              mountPath: /auth
              readOnly: true
        # curl for Harbor's REST API (tag listing and cleanup), with the admin password in its env.
        - name: harbor-api
          image: curlimages/curl
          command: ["sleep", "2147483647"]
          env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
      volumes:
        - name: harbor-pull
          secret:
            secretName: harbor-pull
            items:
              - key: .dockerconfigjson
                path: config.json
