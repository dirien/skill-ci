# Generated by deploy/generate.sh from infra/harbor-setup.sh. Do not edit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-setup-script
  namespace: skill-ci
data:
  harbor-setup.sh: |
    #!/bin/sh
    # Idempotent Harbor setup for skill-ci. Runs inside the harbor-setup Job (curlimages/curl, plain sh).
    #   1. wait until Harbor is healthy
    #   2. create the private project "skills" if it is missing
    #   3. create or update the webhook policy "skill-ci" on that project
    #   4. remove stale policies that point at the old debug receiver
    # Inputs (env): HARBOR_URL, HARBOR_ADMIN_PASSWORD, WEBHOOK_URL, WEBHOOK_TOKEN
    set -eu

    PROJECT="${HARBOR_PROJECT:-skills}"
    POLICY=skill-ci
    API="${HARBOR_URL}/api/v2.0"

    # harbor ARGS...: basic auth as admin, fail on HTTP errors but still print the body.
    harbor() {
      curl -sS --fail-with-body -u "admin:${HARBOR_ADMIN_PASSWORD}" "$@"
    }

    echo "Waiting for Harbor at ${HARBOR_URL} ..."
    attempt=0
    until curl -sS -f "${API}/health" 2>/dev/null | grep -q '"status":"healthy"'; do
      attempt=$((attempt + 1))
      if [ "${attempt}" -gt 90 ]; then
        echo "Harbor did not become healthy in time" >&2
        exit 1
      fi
      sleep 5
    done
    echo "Harbor is healthy."

    if curl -sS -f -I -u "admin:${HARBOR_ADMIN_PASSWORD}" "${API}/projects?project_name=${PROJECT}" >/dev/null 2>&1; then
      echo "Project ${PROJECT} exists."
    else
      echo "Creating private project ${PROJECT} ..."
      harbor -X POST -H 'Content-Type: application/json' \
        -d "{\"project_name\":\"${PROJECT}\",\"metadata\":{\"public\":\"false\"}}" \
        "${API}/projects"
      echo
    fi

    project_id=$(harbor "${API}/projects/${PROJECT}" | grep -o '"project_id":[0-9]*' | head -n 1 | cut -d: -f2)
    echo "Project ${PROJECT} has id ${project_id}."

    # Find the policy we manage; delete duplicates and policies that still point at webhook-receiver.
    policy_id=""
    for id in $(harbor "${API}/projects/${project_id}/webhook/policies" | grep -o '"id":[0-9]*' | cut -d: -f2); do
      body=$(harbor "${API}/projects/${project_id}/webhook/policies/${id}")
      case "${body}" in
        *'"name":"'"${POLICY}"'"'*)
          if [ -z "${policy_id}" ]; then
            policy_id="${id}"
          else
            echo "Deleting duplicate policy ${id}."
            harbor -X DELETE "${API}/projects/${project_id}/webhook/policies/${id}"
          fi
          ;;
        *webhook-receiver*)
          echo "Deleting stale policy ${id} (points at webhook-receiver)."
          harbor -X DELETE "${API}/projects/${project_id}/webhook/policies/${id}"
          ;;
      esac
    done

    payload=$(printf '{"name":"%s","description":"Triggers skill-ci evaluations on skill push","enabled":true,"event_types":["PUSH_ARTIFACT"],"targets":[{"type":"http","address":"%s","auth_header":"Bearer %s","skip_cert_verify":true,"payload_format":"Default"}]}' \
      "${POLICY}" "${WEBHOOK_URL}" "${WEBHOOK_TOKEN}")

    if [ -n "${policy_id}" ]; then
      echo "Updating webhook policy ${POLICY} (id ${policy_id}) ..."
      harbor -X PUT -H 'Content-Type: application/json' -d "${payload}" \
        "${API}/projects/${project_id}/webhook/policies/${policy_id}"
    else
      echo "Creating webhook policy ${POLICY} ..."
      harbor -X POST -H 'Content-Type: application/json' -d "${payload}" \
        "${API}/projects/${project_id}/webhook/policies"
    fi

    echo "Webhook policies on ${PROJECT} now:"
    harbor "${API}/projects/${project_id}/webhook/policies" | grep -o '"address":"[^"]*"\|"event_types":\[[^]]*\]'
    echo "Done."
