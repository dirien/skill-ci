# prometheus-community/kube-prometheus-stack (version: KUBE_PROMETHEUS_STACK_VERSION in deploy/versions.env).
# Trimmed to what the controller needs: Prometheus, the operator and Grafana. Mirrors infra/Pulumi.yaml.
# Needs the Secret grafana-admin in namespace monitoring (keys admin-user, admin-password).
defaultRules:
  create: false
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from every namespace without a Helm release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 24h
    scrapeInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi
grafana:
  enabled: true
  defaultDashboardsEnabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  # Grafana 13 was OOMKilled at 384Mi while serving its frontend bundle.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
