version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "gomod"
    directory: "/controller"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The CI tools (pytest, ruff, yamllint).
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # harbor and kubernetes, which the sandbox environment and its tests import.
  - package-ecosystem: "pip"
    directory: "/harbor-agent-sandbox"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    # harbor must match the release SkillEvaluator pins (0.24.0 for SkillEvaluator 0.6.0), and the
    # sandbox environment subclasses its internals; bump it together with SkillEvaluator, by hand.
    ignore:
      - dependency-name: "harbor"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/controller"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/runner"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # The sandbox image's base image. The agent CLI, Node and nvm pins are ARGs in
  # sandbox/Dockerfile, bumped by hand together with runner/skill_eval.py.
  - package-ecosystem: "docker"
    directory: "/sandbox"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
