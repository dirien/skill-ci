name: Scorecard

# OpenSSF Scorecard (https://github.com/ossf/scorecard): checks the repository's supply-chain
# practices and uploads the results to code scanning (Security > Code scanning). It needs no
# secret: with GITHUB_TOKEN the Branch-Protection check sees less detail than with an admin token.
# publish_results sends the results to the public Scorecard API for the badge; that works only
# for a public repository, needs id-token: write, and limits the job to the allowed actions (no
# run steps, no env). The action supports only the push and schedule triggers.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
