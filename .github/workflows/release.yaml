name: Release

# Push a tag such as v0.7.0 to release. The tag becomes the version of everything:
#   - GitHub release with binaries, checksums, SBOMs and notes (GoReleaser)
#   - ghcr.io/dirien/skill-ci-controller:0.7.0 (linux/amd64, linux/arm64)
#   - ghcr.io/dirien/skill-ci-runner:0.7.0 (linux/amd64)
#   - oci://ghcr.io/dirien/charts/skill-ci-controller, chart version and appVersion 0.7.0
# Tags with a hyphen (v0.7.0-rc.1) are pre-releases and do not move latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the tag is a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Go test
        working-directory: controller
        run: go test -race ./...

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Python test
        run: >-
          uv run --no-project
          --with-requirements .github/requirements-ci.txt
          --with ./harbor-agent-sandbox
          python -m pytest

  controller:
    name: Controller binaries and image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  runner:
    name: Runner image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/dirien/skill-ci-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image tags
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            if [[ "$version" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Build context is the repository root. The base image and the tools are pinned in runner/Dockerfile.
      - name: Build and push runner image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=skill-ci-runner
            org.opencontainers.image.description=Runs one SkillEval: ORAS pulls the skill, SkillEvaluator checks it through all three tiers
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max

      - name: Sign runner image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign -y "${IMAGE}@${DIGEST}"

  chart:
    name: Helm chart
    needs: [controller, runner]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The chart version and appVersion are the tag, and the chart defaults to the images of this
      # release (appVersion tag for the controller, the same tag for the runner).
      - name: Package chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          release_chart="$RUNNER_TEMP/skill-ci-controller"
          cp -r charts/skill-ci-controller "$release_chart"
          .github/scripts/chart-release-values.sh "$release_chart" "$version"
          helm lint --strict "$release_chart"
          helm package "$release_chart" --version "$version" --app-version "$version" --destination .helm-packages

      - name: Push chart to GHCR and sign it
        run: |
          set -o pipefail
          for pkg in .helm-packages/*.tgz; do
            helm push "${pkg}" oci://ghcr.io/dirien/charts |& tee .digest
            digest="$(awk '/^Digest:/ {print $2}' .digest)"
            cosign sign -y "ghcr.io/dirien/charts/skill-ci-controller@${digest}"
          done
