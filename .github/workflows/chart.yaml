name: Chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chart:
    name: Helm lint and template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      # The DeepCopy code, the CRD in config/crd and its copy in the chart are generated.
      - name: Generated files are up to date
        run: |
          make -C controller generate manifests
          make chart-crds
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated files are stale. Run 'make -C controller generate manifests chart-crds' and commit."
            exit 1
          fi

      - name: Chart lint (helm lint --strict, kubeconform, yamllint)
        run: >-
          uv run --no-project --with-requirements .github/requirements-ci.txt
          make chart-lint YAMLLINT=yamllint KUBECONFORM="$(go env GOPATH)/bin/kubeconform"

      # The same steps the release workflow runs: with the version as appVersion, the chart's
      # default images are the controller, runner and sandbox images of that release.
      - name: Release chart packages with GHCR defaults
        run: |
          helm package charts/skill-ci-controller --version 0.0.0-ci --app-version 0.0.0-ci --destination "$RUNNER_TEMP/out"
          helm template skill-ci "$RUNNER_TEMP"/out/skill-ci-controller-0.0.0-ci.tgz --namespace skill-ci > "$RUNNER_TEMP/rendered.yaml"
          for expected in \
            'image: "ghcr.io/dirien/skill-ci-controller:0.0.0-ci"' \
            '--runner-image=ghcr.io/dirien/skill-ci-runner:0.0.0-ci' \
            '--sandbox-image=ghcr.io/dirien/skill-ci-sandbox:0.0.0-ci'; do
            grep -F -e "$expected" "$RUNNER_TEMP/rendered.yaml"
          done
          if grep -E 'imagePullSecrets|digitalocean|docr' "$RUNNER_TEMP/rendered.yaml"; then
            echo "::error::The release chart must default to public GHCR images without pull secrets."
            exit 1
          fi

  vanilla:
    name: Vanilla deploy path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      # deploy/versions.env and infra/Pulumi.yaml must install the same component versions.
      - name: Versions match the Pulumi program
        run: deploy/check-versions.sh

      - name: Generated manifests are up to date
        run: deploy/generate.sh --check

      # ServiceMonitor has no schema in kubeconform's default catalog, so it is skipped.
      - name: Manifests and values render and validate
        run: |
          kc="$(go env GOPATH)/bin/kubeconform"
          for dir in deploy/manifests deploy/manifests/monitoring deploy/manifests/harbor-setup; do
            kubectl kustomize "$dir" | "$kc" -strict -summary -ignore-missing-schemas -
          done
          "$kc" -strict -summary deploy/manifests/seed/*.yaml deploy/manifests/secrets/*.example.yaml
          helm template skill-ci charts/skill-ci-controller --namespace skill-ci \
            -f deploy/helm/values/skill-ci-controller.yaml | "$kc" -strict -summary -ignore-missing-schemas -
