name: skill-ci-doks
description: Test cluster for skill CI (DOKS + Agent Sandbox)
runtime: yaml

config:
  region:
    type: string
    default: fra1
  agentSandboxVersion:
    type: string
    default: v1.0.9
  harborChartVersion:
    type: string
    default: 1.19.4
  orasVersion:
    type: string
    default: v1.3.0
  curlVersion:
    type: string
    default: 8.14.1
  kubePrometheusStackVersion:
    type: string
    default: 92.10.1
  # The skill-ci release: OCI chart oci://ghcr.io/dirien/charts/skill-ci-controller and the controller,
  # runner and sandbox images of the same tag. Same value as SKILL_CI_VERSION in deploy/versions.env.
  skillCiVersion:
    type: string
    default: 0.9.0
  # Optional OTLP push of the controller's skillci_* metrics (chart values otlp.*, CONTRACT.md
  # "OpenTelemetry export"). Off while otlpEndpoint is empty. The ServiceMonitor below already scrapes
  # the controller into this stack's Prometheus: do not push into that Prometheus as well.
  otlpEndpoint:
    type: string
    default: ""
  otlpProtocol:
    type: string
    default: http/protobuf
  otlpUrlPath:
    type: string
    default: ""
  otlpInsecure:
    type: boolean
    default: false
  otlpInterval:
    type: string
    default: ""
  # A Secret in skill-ci whose key `headers` holds the OTLP headers, e.g. an ingest key.
  otlpHeadersSecret:
    type: string
    default: ""

variables:
  # The Harbor setup script is also a Job input, so editing it re-runs the Job.
  harborSetupScript:
    fn::readFile: ./harbor-setup.sh
  # Initial model list. Pulumi only seeds it, see the skill-ci-models resource.
  initialModels:
    fn::readFile: ../demo/models.yaml
  skillCiDashboard:
    fn::readFile: ./dashboards/skill-ci.json
  k8sVersion:
    fn::invoke:
      function: digitalocean:getKubernetesVersions
      arguments:
        versionPrefix: "1.36."
      return: latestVersion

resources:
  cluster:
    type: digitalocean:KubernetesCluster
    properties:
      name: skill-ci
      region: ${region}
      version: ${k8sVersion}
      nodePool:
        name: default
        size: s-4vcpu-8gb
        # Each eval fans out into several sandboxes; scale out instead of timing out.
        autoScale: true
        minNodes: 2
        maxNodes: 5

  k8s:
    type: pulumi:providers:kubernetes
    properties:
      kubeconfig: ${cluster.kubeConfigs[0].rawConfig}

  ns:
    type: kubernetes:core/v1:Namespace
    properties:
      metadata:
        name: skill-ci
    options:
      provider: ${k8s}

  agentSandbox:
    type: kubernetes:yaml/v2:ConfigFile
    properties:
      file: https://github.com/kubernetes-sigs/agent-sandbox/releases/download/${agentSandboxVersion}/sandbox-with-extensions.yaml
    options:
      provider: ${k8s}

  # goharbor: stores skills as OCI artifacts and fires PUSH_ARTIFACT webhooks.
  harborAdminPassword:
    type: random:RandomPassword
    properties:
      length: 24
      special: false

  harbor:
    type: kubernetes:helm.sh/v3:Release
    properties:
      name: harbor
      chart: harbor
      version: ${harborChartVersion}
      namespace: harbor
      createNamespace: true
      repositoryOpts:
        repo: https://helm.goharbor.io
      values:
        expose:
          type: clusterIP
          tls:
            enabled: false
        # Pods authenticate against the token service at this URL, so it has to resolve in the cluster.
        # Reach Harbor from outside only through in-cluster tooling (toolbox pod, kubectl port-forward svc/harbor).
        externalURL: http://harbor.harbor.svc.cluster.local
        harborAdminPassword: ${harborAdminPassword.result}
        trivy:
          enabled: false
        # DigitalOcean volumes are ReadWriteOnce: a rolling update deadlocks the registry and jobservice
        # pods on their volumes, so replace them instead.
        updateStrategy:
          type: Recreate
        # A scale-down must not move Harbor during a demo: every component stays put.
        nginx: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
        portal: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
        core: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
        jobservice: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
        registry: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
        database: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
        redis: {podAnnotations: {cluster-autoscaler.kubernetes.io/safe-to-evict: "false"}}
    options:
      provider: ${k8s}

  # Shared secret between Harbor's webhook policy and the controller.
  harborWebhookToken:
    type: random:RandomPassword
    properties:
      length: 40
      special: false

  # Admin credentials for the controller's Harbor REST calls.
  # A project-scoped robot account is the production choice. Admin keeps the demo reproducible.
  harborCredentialsSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: harbor-credentials
        namespace: ${ns.metadata.name}
      stringData:
        username: admin
        password: ${harborAdminPassword.result}
    options:
      provider: ${k8s}

  # Registry config for oras pulls and pushes against the in-cluster Harbor.
  harborPullSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: harbor-pull
        namespace: ${ns.metadata.name}
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson:
          fn::toJSON:
            auths:
              harbor.harbor.svc.cluster.local:
                username: admin
                password: ${harborAdminPassword.result}
                auth:
                  fn::toBase64: admin:${harborAdminPassword.result}
    options:
      provider: ${k8s}

  harborWebhookSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: harbor-webhook
        namespace: ${ns.metadata.name}
      stringData:
        token: ${harborWebhookToken.result}
    options:
      provider: ${k8s}

  # Changes whenever an input of the setup Job changes. It names the Job, so a new Job runs instead of a stale one.
  harborSetupRun:
    type: random:RandomId
    properties:
      byteLength: 3
      keepers:
        script: ${harborSetupScript}
        image: curlimages/curl:${curlVersion}
        adminPassword: ${harborAdminPassword.result}
        webhookToken: ${harborWebhookToken.result}

  # Idempotent: waits for Harbor, creates project "skills", creates or updates the webhook policy.
  harborSetup:
    type: kubernetes:batch/v1:Job
    properties:
      metadata:
        name: harbor-setup-${harborSetupRun.hex}
        namespace: ${ns.metadata.name}
      spec:
        backoffLimit: 4
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: setup
                image: curlimages/curl:${curlVersion}
                command: ["/bin/sh", "-c"]
                args:
                  - ${harborSetupScript}
                env:
                  - name: HARBOR_URL
                    value: http://harbor.harbor.svc.cluster.local
                  - name: WEBHOOK_URL
                    value: http://skill-ci-controller.skill-ci.svc.cluster.local:8080/webhook/harbor
                  - name: HARBOR_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: ${harborCredentialsSecret.metadata.name}
                        key: password
                  - name: WEBHOOK_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: ${harborWebhookSecret.metadata.name}
                        key: token
    options:
      provider: ${k8s}
      dependsOn:
        - ${harbor}

  # Pushes skills from inside the cluster (Harbor is only reachable there). Used by demo/*.sh via kubectl exec.
  toolbox:
    type: kubernetes:apps/v1:Deployment
    properties:
      metadata:
        name: toolbox
        namespace: ${ns.metadata.name}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: toolbox
        template:
          metadata:
            labels:
              app: toolbox
            annotations:
              kubectl.kubernetes.io/default-container: oras
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            containers:
              - name: oras
                image: ghcr.io/oras-project/oras:${orasVersion}
                command: ["sleep", "2147483647"]
                workingDir: /workspace
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 256Mi
                volumeMounts:
                  - name: harbor-pull
                    mountPath: /auth
                    readOnly: true
              # curl for Harbor's REST API (tag listing and cleanup), with the admin password in its env.
              - name: harbor-api
                image: curlimages/curl:${curlVersion}
                command: ["sleep", "2147483647"]
                env:
                  - name: HARBOR_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: ${harborCredentialsSecret.metadata.name}
                        key: password
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    memory: 128Mi
            volumes:
              - name: harbor-pull
                secret:
                  secretName: ${harborPullSecret.metadata.name}
                  items:
                    - key: .dockerconfigjson
                      path: config.json
    options:
      provider: ${k8s}

  # Seeds the model list. The demo edits it live (make demo-model-swap), so Pulumi ignores later changes to data.
  # Source of truth for the initial content and for make reset: demo/models.yaml.
  modelsConfigMap:
    type: kubernetes:core/v1:ConfigMap
    properties:
      metadata:
        name: skill-ci-models
        namespace: ${ns.metadata.name}
      data:
        models.yaml: ${initialModels}
    options:
      provider: ${k8s}
      ignoreChanges:
        - data

  # Metrics and dashboards: Prometheus + Grafana, trimmed to what the controller needs.
  monitoringNs:
    type: kubernetes:core/v1:Namespace
    properties:
      metadata:
        name: monitoring
    options:
      provider: ${k8s}

  grafanaAdminPassword:
    type: random:RandomPassword
    properties:
      length: 20
      special: false

  grafanaAdminSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: grafana-admin
        namespace: ${monitoringNs.metadata.name}
      stringData:
        admin-user: admin
        admin-password: ${grafanaAdminPassword.result}
    options:
      provider: ${k8s}

  kubePrometheusStack:
    type: kubernetes:helm.sh/v3:Release
    properties:
      name: kps
      chart: kube-prometheus-stack
      version: ${kubePrometheusStackVersion}
      namespace: ${monitoringNs.metadata.name}
      repositoryOpts:
        repo: https://prometheus-community.github.io/helm-charts
      values:
        defaultRules:
          create: false
        alertmanager:
          enabled: false
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
        kubeApiServer:
          enabled: false
        kubelet:
          enabled: false
        coreDns:
          enabled: false
        kubeDns:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        prometheusOperator:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
        prometheus:
          prometheusSpec:
            # Pick up ServiceMonitors from every namespace without a Helm release label.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: 24h
            scrapeInterval: 15s
            resources:
              requests:
                cpu: 100m
                memory: 400Mi
              limits:
                memory: 800Mi
        grafana:
          enabled: true
          defaultDashboardsEnabled: false
          admin:
            existingSecret: ${grafanaAdminSecret.metadata.name}
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
          # Grafana 13 was OOMKilled at 384Mi while serving its frontend bundle.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
    options:
      provider: ${k8s}

  # Scrapes the controller's /metrics. The Service itself ships with the controller's Helm chart
  # (make deploy). To push the same metrics over OTLP instead, see CONTRACT.md "OpenTelemetry export".
  controllerServiceMonitor:
    type: kubernetes:yaml/v2:ConfigGroup
    properties:
      objs:
        - apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: skill-ci-controller
            namespace: skill-ci
            labels:
              app.kubernetes.io/name: skill-ci-controller
          spec:
            namespaceSelector:
              matchNames:
                - skill-ci
            selector:
              matchLabels:
                app.kubernetes.io/name: skill-ci-controller
            endpoints:
              - port: metrics
                path: /metrics
                interval: 15s
    options:
      provider: ${k8s}
      dependsOn:
        - ${kubePrometheusStack}
        - ${ns}

  # The SkillEval CRD from the chart's crds/. Helm installs crds/ once and never upgrades them, so
  # Pulumi applies the CRD itself and the release skips them.
  skillCiCrds:
    type: kubernetes:yaml/v2:ConfigFile
    properties:
      file: ../charts/skill-ci-controller/crds/skillci.dev_skillevals.yaml
    options:
      provider: ${k8s}

  # SandboxProfile: Agent Sandbox template and warm pool for the trials (CONTRACT.md "SandboxProfile").
  # A resource of its own, so adding it never replaces the SkillEval CRD above (that would delete every run).
  sandboxProfileCrd:
    type: kubernetes:yaml/v2:ConfigFile
    properties:
      file: ../charts/skill-ci-controller/crds/skillci.dev_sandboxprofiles.yaml
    options:
      provider: ${k8s}

  # The controller, from the published OCI chart. deploy/helm/values/skill-ci-controller.yaml is shared
  # with the plain Helm path (deploy/install.sh); the image tags and OTLP settings come from config.
  skillCiController:
    type: kubernetes:helm.sh/v3:Release
    properties:
      name: skill-ci
      chart: oci://ghcr.io/dirien/charts/skill-ci-controller
      version: ${skillCiVersion}
      namespace: ${ns.metadata.name}
      skipCrds: true
      valueYamlFiles:
        - fn::fileAsset: ../deploy/helm/values/skill-ci-controller.yaml
      values:
        image:
          tag: ${skillCiVersion}
        controller:
          runnerImage:
            tag: ${skillCiVersion}
          sandboxImage:
            tag: ${skillCiVersion}
        otlp:
          endpoint: ${otlpEndpoint}
          protocol: ${otlpProtocol}
          urlPath: ${otlpUrlPath}
          insecure: ${otlpInsecure}
          interval: ${otlpInterval}
          headersSecret:
            name: ${otlpHeadersSecret}
    options:
      provider: ${k8s}
      dependsOn:
        - ${skillCiCrds}
        - ${sandboxProfileCrd}
        - ${agentSandbox}
        - ${harborCredentialsSecret}
        - ${harborWebhookSecret}
        - ${modelsConfigMap}
        - ${harborSetup}

  # Picked up by the Grafana sidecar through the grafana_dashboard label.
  skillCiDashboardConfigMap:
    type: kubernetes:core/v1:ConfigMap
    properties:
      metadata:
        name: skill-ci-dashboard
        namespace: ${monitoringNs.metadata.name}
        labels:
          grafana_dashboard: "1"
      data:
        skill-ci.json: ${skillCiDashboard}
    options:
      provider: ${k8s}
      # A data change replaces a ConfigMap, and its fixed name would clash with the replacement.
      deleteBeforeReplace: true

outputs:
  kubeconfig:
    fn::secret: ${cluster.kubeConfigs[0].rawConfig}
  k8sVersion: ${k8sVersion}
  harborAdminPassword:
    fn::secret: ${harborAdminPassword.result}
  grafanaAdminPassword:
    fn::secret: ${grafanaAdminPassword.result}
  grafanaService: kps-grafana
