# kubectl apply -k config/
# Not included: the skill-ci namespace, the secrets (llm-keys, harbor-credentials,
# harbor-pull, harbor-webhook), the skill-ci-models ConfigMap and SkillEval objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skill-ci
resources:
  - crd/skillci.dev_sandboxprofiles.yaml
  - crd/skillci.dev_skillciconfigs.yaml
  - crd/skillci.dev_skillevals.yaml
  - rbac/controller.yaml
  - rbac/runner.yaml
  - manager/deployment.yaml
  - manager/service.yaml
  # Need the SandboxProfile and SkillCIConfig CRDs above to be established: on a new cluster a
  # first `kubectl apply -k config/` may report it; apply again. Until the profile exists, runs
  # start a bare Sandbox per trial; until the config exists, the built-in defaults apply. With
  # kustomize these files are the source of truth: `kubectl apply -k` resets edits made with
  # kubectl edit, so change the files (or drop them from this list and own the objects yourself).
  - manager/sandboxprofile.yaml
  - manager/skillciconfig.yaml
images:
  - name: ghcr.io/dirien/skill-ci-controller
    newTag: 0.9.0
