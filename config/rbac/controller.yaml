# Identity and permissions of the skill-ci controller. Everything is namespaced except reading
# CustomResourceDefinitions, which tells the controller whether Cilium and the Agent Sandbox
# extensions are installed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skill-ci-controller
  namespace: skill-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skill-ci-controller
  namespace: skill-ci
rules:
  - apiGroups: ["skillci.dev"]
    resources: ["skillevals"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["skillci.dev"]
    resources: ["skillevals/status"]
    verbs: ["get", "update", "patch"]
  # Needed to set blockOwnerDeletion on the Jobs it owns.
  - apiGroups: ["skillci.dev"]
    resources: ["skillevals/finalizers"]
    verbs: ["update"]
  # SandboxProfiles: the controller reads them and writes their status.
  - apiGroups: ["skillci.dev"]
    resources: ["sandboxprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["skillci.dev"]
    resources: ["sandboxprofiles/status"]
    verbs: ["get", "update", "patch"]
  # Needed to set blockOwnerDeletion on the templates and warm pools it owns.
  - apiGroups: ["skillci.dev"]
    resources: ["sandboxprofiles/finalizers"]
    verbs: ["update"]
  # SkillCIConfigs: the controller reads the platform settings and writes their status.
  - apiGroups: ["skillci.dev"]
    resources: ["skillciconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["skillci.dev"]
    resources: ["skillciconfigs/status"]
    verbs: ["get", "update", "patch"]
  # The SandboxTemplate and SandboxWarmPool of every SandboxProfile (Agent Sandbox extensions).
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools/status"]
    verbs: ["get"]
  # Network modes: the baseline policy and one policy per SkillEval.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # llm-keys only: openai-base-url decides the model host of Codex runs with network none or allowlist, and the
  # reporting site redacts every key value from the sessions it renders.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["llm-keys"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The model list: read it, and record the last-applied copy in an annotation.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Only used with --leader-elect.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skill-ci-controller
  namespace: skill-ci
subjects:
  - kind: ServiceAccount
    name: skill-ci-controller
    namespace: skill-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skill-ci-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skill-ci-controller-crds-skill-ci
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skill-ci-controller-crds-skill-ci
subjects:
  - kind: ServiceAccount
    name: skill-ci-controller
    namespace: skill-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skill-ci-controller-crds-skill-ci
