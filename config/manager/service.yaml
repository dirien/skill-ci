apiVersion: v1
kind: Service
metadata:
  name: skill-ci-controller
  namespace: skill-ci
  labels:
    app.kubernetes.io/name: skill-ci-controller
spec:
  selector:
    app.kubernetes.io/name: skill-ci-controller
  ports:
    - name: webhook
      port: 8080
      targetPort: webhook
    - name: metrics
      port: 8081
      targetPort: metrics
    - name: reports
      port: 8082
      targetPort: reports
