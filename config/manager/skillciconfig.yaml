# The platform settings of the controller (CONTRACT.md "SkillCIConfig"): the default SandboxProfile, the
# network policy of the trial sandboxes, the Hubble Relay of the network flows and the LLM judge. The
# controller reads only the object named default in its namespace, whenever it resolves a run, so a change
# applies without a restart. These are the built-in defaults; fields left out get the same values from the
# CRD.
apiVersion: skillci.dev/v1alpha1
kind: SkillCIConfig
metadata:
  name: default
  namespace: skill-ci
spec:
  defaultSandboxProfile: default
  network:
    default: full
    modes: [none, allowlist, full]
    enforcement: auto
    alwaysAllow: []
    bundles:
      apt: [deb.debian.org, security.debian.org]
      github: [github.com, api.github.com, codeload.github.com, objects.githubusercontent.com]
      node: [registry.npmjs.org]
      python: [pypi.org, files.pythonhosted.org]
    agentInstallHosts: [registry.npmjs.org]
  observability:
    # host:port of Hubble Relay (HUBBLE_SERVER of runner Jobs); empty collects no network flows. On Cilium
    # with Hubble Relay (DOKS): hubble-relay.kube-system.svc.cluster.local:80
    hubbleRelay: ""
  judge:
    provider: anthropic   # anthropic | openai | openai-compatible | nv_build
    model: ""             # empty: SkillEvaluator's default model of the provider
    baseURL: ""           # required for openai-compatible
    secretKey: anthropic  # the llm-keys key with the judge's API key
