---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: skillevals.skillci.dev
spec:
  group: skillci.dev
  names:
    kind: SkillEval
    listKind: SkillEvalList
    plural: skillevals
    shortNames:
    - se
    singular: skilleval
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.skill
      name: Skill
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.agent
      name: Agent
      type: string
    - jsonPath: .status.agentVersion
      name: AgentVer
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.withSkill
      name: With
      type: string
    - jsonPath: .status.withoutSkill
      name: Without
      type: string
    - jsonPath: .status.lift
      name: Lift
      type: string
    - jsonPath: .status.verdict
      name: Verdict
      type: string
    - jsonPath: .status.tiers.tier1
      name: Tier1
      type: string
    - jsonPath: .status.network.mode
      name: Network
      type: string
    - jsonPath: .status.liftCI
      name: Lift CI
      priority: 1
      type: string
    - jsonPath: .status.n
      name: "N"
      priority: 1
      type: string
    - jsonPath: .status.publication
      name: Publication
      priority: 1
      type: string
    - jsonPath: .status.reportDigest
      name: Report
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SkillEval is one evaluation of a skill digest with one model.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SkillEvalSpec identifies one skill digest and one model to
              evaluate it with.
            properties:
              agent:
                description: Agent is the agent harness, for example claude-code.
                minLength: 1
                type: string
              agentVersion:
                description: |-
                  AgentVersion is the release of the agent CLI to evaluate with, for
                  example 2.1.292. Empty means the runner's default pin for the agent.
                maxLength: 63
                pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
                type: string
              attempts:
                default: 1
                description: Attempts is the number of trials per arm.
                minimum: 1
                type: integer
              digest:
                description: Digest is the manifest digest, the identity of the version.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              model:
                description: Model is the pinned model name.
                minLength: 1
                type: string
              network:
                description: |-
                  Network is the network the skill declared for its trials, or the
                  platform default. The controller fills it in from the OCI manifest
                  annotations of the digest before the run starts.
                properties:
                  allow:
                    description: |-
                      Allow holds the hosts and @bundles the skill declared
                      (skillci.dev/network-allow), as declared. Used only with allowlist.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  mode:
                    description: |-
                      Mode is none, allowlist or full. A mode the platform does not allow
                      fails the run before any Job starts.
                    maxLength: 32
                    type: string
                  source:
                    description: 'Source says where the mode comes from: skill or
                      default.'
                    enum:
                    - skill
                    - default
                    type: string
                required:
                - mode
                - source
                type: object
              required:
                description: Required marks the model as one that gates promotion.
                type: boolean
              sandboxProfile:
                description: |-
                  SandboxProfile names the SandboxProfile whose warm pool the trials run
                  in, copied from the model list entry (default: the SkillCIConfig
                  spec.defaultSandboxProfile). Empty means the default profile, and a bare
                  Sandbox per trial when that profile does not exist.
                maxLength: 253
                type: string
              skill:
                description: Skill is the repository name in the skills project.
                minLength: 1
                type: string
              trigger:
                default: manual
                description: Trigger records why the eval exists.
                enum:
                - push
                - model-change
                - manual
                type: string
              version:
                description: Version is the semver tag that was pushed.
                pattern: ^v\d+\.\d+\.\d+$
                type: string
            required:
            - agent
            - digest
            - model
            - skill
            - version
            type: object
          status:
            description: SkillEvalStatus is the observed state of a SkillEval.
            properties:
              agentVersion:
                description: |-
                  AgentVersion is the agent CLI release the trials ran, as the runner
                  reported it; until then the release the spec asks for.
                type: string
              attempts:
                description: |-
                  Attempts are the earlier Jobs of a retried run, oldest first, at most
                  10. The current Job is JobName and ReportDigest and is not listed.
                items:
                  description: |-
                    RunAttempt is an earlier Job of a retried run. Its report and trial bundle
                    stay reachable after status.reportDigest moved on to the next Job.
                  properties:
                    jobName:
                      description: JobName is the Job of the attempt.
                      maxLength: 63
                      type: string
                    message:
                      description: Message says why the attempt ended, at most 1024
                        characters.
                      maxLength: 1024
                      type: string
                    reportDigest:
                      description: |-
                        ReportDigest is the report the attempt attached, with its trial bundle;
                        empty when it attached none.
                      maxLength: 71
                      type: string
                  required:
                  - jobName
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              completedAt:
                description: CompletedAt is when the eval reached Succeeded or Failed.
                format: date-time
                type: string
              conditions:
                description: Conditions record what the tag policy did with this result.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              findings:
                description: Findings names the failing tier and check, at most five
                  short strings.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              jobName:
                description: JobName is the runner Job.
                type: string
              lift:
                description: Lift is WithSkill minus WithoutSkill, signed, two decimals.
                type: string
              liftCI:
                description: |-
                  LiftCI is the confidence interval of the lift (Welch's t), for example [+0.41, +0.73].
                  The level is the controller's --confidence.
                type: string
              message:
                description: Message is a human readable detail, for example a failure
                  reason.
                type: string
              "n":
                description: N is the number of trials behind the scores, with-skill/without-skill,
                  for example 9/9.
                type: string
              network:
                description: |-
                  Network is the network the trials got; absent for runs made before
                  network modes existed (they ran with full).
                properties:
                  enforced:
                    description: Enforced reports whether a CiliumNetworkPolicy enforces
                      the mode.
                    type: boolean
                  hosts:
                    description: |-
                      Hosts are the hosts the trials may reach on TCP 443 with none and
                      allowlist, bundles expanded, sorted. Empty for full.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  mode:
                    description: 'Mode is the effective mode: none, allowlist or full.'
                    type: string
                  policy:
                    description: |-
                      Policy is the CiliumNetworkPolicy that enforces the mode; empty when
                      nothing enforces it.
                    type: string
                required:
                - enforced
                type: object
              phase:
                description: Phase is the lifecycle phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Planned
                type: string
              publication:
                description: 'Publication is SkillEvaluator''s publication assessment:
                  passed, failed or incomplete.'
                type: string
              reportDigest:
                description: |-
                  ReportDigest is the digest of the eval report attached to the skill in
                  the registry by the current Job, also for a Failed run whose Tier 3
                  started.
                type: string
              retries:
                description: |-
                  Retries counts the times the controller started a fresh Job after an
                  infrastructure failure. The first Job is not a retry; the Job of retry n
                  is named <skilleval>-rn. See the Retried condition for the failure.
                minimum: 0
                type: integer
              samples:
                description: |-
                  Samples are the per-trial scores the statistics come from; absent for
                  runs of a runner that does not report them.
                properties:
                  withSkill:
                    description: WithSkill holds the with-skill trial scores.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  withoutSkill:
                    description: WithoutSkill holds the baseline trial scores.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              sandboxProfile:
                description: |-
                  SandboxProfile is the SandboxProfile the run used; empty when it ran a
                  bare Sandbox per trial.
                type: string
              tiers:
                description: |-
                  Tiers is the outcome of the three SkillEvaluator tiers; absent when the
                  runner is older than the tiers.
                properties:
                  tier1:
                    description: Tier1 is the static, security and quality tier.
                    type: string
                  tier2:
                    description: Tier2 is the deduplication tier.
                    type: string
                  tier3:
                    description: Tier3 is the live with and without skill evaluation.
                    type: string
                type: object
              verdict:
                description: Verdict classifies the lift.
                enum:
                - Helps
                - Neutral
                - Hurts
                - Obsolete
                - Regressed
                - Inconclusive
                - Rejected
                type: string
              warmPool:
                description: |-
                  WarmPool is the SandboxWarmPool the runner claimed trial pods from
                  (SANDBOX_WARM_POOL); empty for a bare Sandbox per trial.
                type: string
              withSkill:
                description: WithSkill is the score with the skill, two decimals.
                type: string
              withSkillStdErr:
                description: WithSkillStdErr is the standard error of the with-skill
                  trial scores, two decimals.
                type: string
              withoutSkill:
                description: WithoutSkill is the score without the skill, two decimals.
                type: string
              withoutSkillStdErr:
                description: WithoutSkillStdErr is the standard error of the baseline
                  trial scores, two decimals.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
