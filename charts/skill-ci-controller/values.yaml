# Default values for skill-ci-controller.
# The defaults reproduce config/manager/deployment.yaml in the repository root.

nameOverride: ""
# Defaults to the chart name. The controller expects the Service skill-ci-controller
# (Harbor webhook target), so change this only together with the webhook policy.
fullnameOverride: ""
# Extra labels on every object the chart creates.
commonLabels: {}

replicaCount: 1
# Recreate because leader election is off by default (one active controller at a time).
strategy:
  type: Recreate

image:
  repository: ghcr.io/dirien/skill-ci-controller
  # Defaults to the chart appVersion.
  tag: ""
  # Takes precedence over tag, for example sha256:0123...
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets of the controller pod. The names are also passed to the controller
# (--image-pull-secrets) for the runner Jobs and the sandboxes they start. Empty: the images
# are public, which is how the GHCR packages are published.
imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the fullname when create=true.
  name: ""
  annotations: {}

rbac:
  # Controller Role and RoleBinding.
  create: true
  # Extra PolicyRules appended to the controller Role.
  extraRules: []

# Controller flags (see controller/cmd/manager/main.go).
controller:
  # --namespace. Defaults to the release namespace. Role, RoleBinding and the runner
  # ServiceAccount are created in this namespace.
  namespace: ""
  harborUrl: http://harbor.harbor.svc.cluster.local
  harborProject: skills
  # --runner-image, rendered as repository:tag or repository@digest.
  runnerImage:
    repository: ghcr.io/dirien/skill-ci-runner
    # Defaults to the chart appVersion, the release the chart was published with.
    tag: ""
    digest: ""
  # --sandbox-image: the generic image every trial sandbox starts from (SANDBOX_IMAGE of the
  # runner Job). Nothing is built in the cluster. Keep it on the release of the runner image:
  # the runner replays the task Dockerfile on it and fails a trial whose steps the image lacks.
  sandboxImage:
    repository: ghcr.io/dirien/skill-ci-sandbox
    # Defaults to the chart appVersion.
    tag: ""
    digest: ""
  modelsConfigMap: skill-ci-models
  # Attempts per arm. One attempt is too noisy for the regression gate: the same
  # version scored 0.95 and 0.87 on two single-attempt runs.
  defaultAttempts: 3
  # Lift thresholds, as strings to keep the trailing zero.
  thresholds:
    helps: "0.05"
    hurts: "-0.10"
    promote: "0.10"
    demote: "-0.10"
    obsoleteBaseline: "0.80"
    # --regression-tolerance: with-skill drop below the stable version that still allows
    # promotion. Empty omits the flag (controller default 0.05); controller images before
    # 0.2.0 exit on the unknown flag, so set it to "" for those.
    regressionTolerance: "0.05"
    # --confidence: level of the confidence intervals the gate uses (0 to 1, exclusive). A lift
    # earns stable only when its interval lies above zero, and a drop below the stable version
    # blocks promotion as a regression only when its interval lies below zero. A higher level
    # asks for more evidence. Empty omits the flag; controller images before 0.5.0 exit on the
    # unknown flag, so set it to "" for those.
    confidence: "0.95"
  # Deployed with 3 so 3 Jobs x 2 trials fit a small cluster (the flag default is 4).
  maxConcurrentJobs: 3
  # Max trials per controller lifetime, 0 is unlimited.
  trialBudget: 200
  # --max-retries: fresh Jobs a run gets after an infrastructure failure (environment start
  # timeout, lost connection, agent install or setup step failing, evicted or lost pod).
  # Runs with scores, Tier 1/2 rejections and agent failures are never retried. 0 disables.
  # Needs controller image 0.4.1 or newer; older images exit on the unknown flag.
  maxRetries: 1
  # Create SkillEvals in phase Planned and no Jobs.
  dryRun: false
  leaderElect: false
  # controller-runtime zap logging flags. Empty means the controller default.
  logging:
    level: ""
    encoder: ""
    development: false

# Container and Service ports. They also set --webhook-addr and --metrics-addr.
ports:
  webhook: 8080
  metrics: 8081
  # Reporting website, see reports.enabled.
  reports: 8082

# Read-only reporting website served by the controller (--reports-addr): runs, release
# channels, policy decisions and the stored SkillEvaluator reports. Needs controller
# image 0.3.0 or newer, older images exit on the unknown flag.
reports:
  enabled: true

# Additional raw arguments, for example ["--zap-stacktrace-level=error"].
extraArgs: []
# Additional container env entries.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Secrets are referenced by name and never created unless create=true (demos and tests).
# Create them out of band: kubectl, Pulumi ESC, External Secrets or sealed-secrets.
secrets:
  # Harbor REST API credentials of the controller (robot account or admin).
  harborCredentials:
    existingSecret: harbor-credentials
    usernameKey: username
    passwordKey: password
    create: false
    username: ""
    password: ""
  # Bearer token the Harbor webhook policy sends.
  harborWebhook:
    existingSecret: harbor-webhook
    tokenKey: token
    # With optional=true a missing Secret leaves WEBHOOK_TOKEN empty and the
    # controller accepts every webhook (with a warning).
    optional: true
    create: false
    token: ""
  # LLM API keys used by runner Jobs. The controller hardcodes the name llm-keys in the
  # Jobs it creates, so the chart only documents it and can create it; changing the name
  # has no effect on the Jobs. Secret keys (all but anthropic are optional):
  #   anthropic        the judge, and the model of Claude Code and of OpenCode's anthropic/... models
  #   openai           Codex (OPENAI_API_KEY) and Tier 2 embeddings
  #   openai-base-url  OPENAI_BASE_URL for Codex; the runner uses https://api.openai.com/v1 without it
  #   ollama           OpenCode models "ollama-cloud/<model>" (Ollama Cloud, OpenAI-compatible)
  #   openrouter       OpenCode models "openrouter/<model>"
  #   nvidia           OpenCode models "nvidia/<model>" (NVIDIA Build), and Tier 2 embeddings when
  #                    there is no openai key
  llmKeys:
    existingSecret: llm-keys
    create: false
    anthropic: ""
    openai: ""
    openaiBaseUrl: ""
    nvidia: ""
    ollama: ""
    openrouter: ""

# Runner Jobs ServiceAccount, Role and RoleBinding. The controller hardcodes
# the ServiceAccount name skill-eval-runner.
runner:
  enabled: true
  serviceAccount:
    name: skill-eval-runner
    annotations: {}
  # A Secret the runner may read. Empty (the default) adds no rule. Needed only when you let
  # the trials build task images in a registry of your own (runner env TASK_IMAGE_REGISTRY and
  # TASK_IMAGE_PULL_SECRET): Harbor reads that registry's credentials from the Secret.
  pullSecretName: ""
  extraRules: []

service:
  type: ClusterIP
  webhookPort: 8080
  metricsPort: 8081
  reportsPort: 8082
  annotations: {}
  labels: {}

serviceMonitor:
  # Needs the Prometheus Operator CRDs. Do not enable while another ServiceMonitor
  # selects this Service, or the metrics are scraped twice.
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  # Extra labels, for example {release: kps} for a kube-prometheus-stack selector.
  labels: {}
  interval: 15s
  scrapeTimeout: ""
  path: /metrics
  relabelings: []
  metricRelabelings: []

podAnnotations: {}
podLabels: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Probes are served by the webhook server on the webhook port.
livenessProbe:
  httpGet:
    path: /healthz
    port: webhook
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: webhook
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
