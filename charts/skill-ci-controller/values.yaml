# Default values for skill-ci-controller.
# The defaults reproduce config/manager/deployment.yaml in the repository root.

nameOverride: ""
# Defaults to the chart name. The controller expects the Service skill-ci-controller
# (Harbor webhook target), so change this only together with the webhook policy.
fullnameOverride: ""
# Extra labels on every object the chart creates.
commonLabels: {}

replicaCount: 1
# Recreate because leader election is off by default (one active controller at a time).
strategy:
  type: Recreate

image:
  repository: ghcr.io/dirien/skill-ci-controller
  # Defaults to the chart appVersion.
  tag: ""
  # Takes precedence over tag, for example sha256:0123...
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets of the controller pod. The names are also passed to the controller
# (--image-pull-secrets) for the runner Jobs and the sandboxes they start. Empty: the images
# are public, which is how the GHCR packages are published.
imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the fullname when create=true.
  name: ""
  annotations: {}

rbac:
  # Controller Role and RoleBinding.
  create: true
  # Extra PolicyRules appended to the controller Role.
  extraRules: []

# Controller flags (see controller/cmd/manager/main.go).
controller:
  # --namespace. Defaults to the release namespace. Role, RoleBinding and the runner
  # ServiceAccount are created in this namespace.
  namespace: ""
  harborUrl: http://harbor.harbor.svc.cluster.local
  harborProject: skills
  # --runner-image, rendered as repository:tag or repository@digest.
  runnerImage:
    repository: ghcr.io/dirien/skill-ci-runner
    # Defaults to the chart appVersion, the release the chart was published with.
    tag: ""
    digest: ""
  # --sandbox-image: the generic image every trial sandbox starts from (SANDBOX_IMAGE of the
  # runner Job). Nothing is built in the cluster. Keep it on the release of the runner image:
  # the runner replays the task Dockerfile on it and fails a trial whose steps the image lacks.
  sandboxImage:
    repository: ghcr.io/dirien/skill-ci-sandbox
    # Defaults to the chart appVersion.
    tag: ""
    digest: ""
  modelsConfigMap: skill-ci-models
  # Attempts per arm. One attempt is too noisy for the regression gate: the same
  # version scored 0.95 and 0.87 on two single-attempt runs.
  defaultAttempts: 3
  # Lift thresholds, as strings to keep the trailing zero.
  thresholds:
    helps: "0.05"
    hurts: "-0.10"
    promote: "0.10"
    demote: "-0.10"
    obsoleteBaseline: "0.80"
    # --regression-tolerance: with-skill drop below the stable version that still allows
    # promotion. Empty omits the flag (controller default 0.05); controller images before
    # 0.2.0 exit on the unknown flag, so set it to "" for those.
    regressionTolerance: "0.05"
    # --confidence: level of the confidence intervals the gate uses (0 to 1, exclusive). A lift
    # earns stable only when its interval lies above zero, and a drop below the stable version
    # blocks promotion as a regression only when its interval lies below zero. A higher level
    # asks for more evidence. Empty omits the flag; controller images before 0.5.0 exit on the
    # unknown flag, so set it to "" for those.
    confidence: "0.95"
  # Deployed with 3 so 3 Jobs x 2 trials fit a small cluster (the flag default is 4).
  maxConcurrentJobs: 3
  # Max trials per controller lifetime, 0 is unlimited.
  trialBudget: 200
  # --max-retries: fresh Jobs a run gets after an infrastructure failure (environment start
  # timeout, lost connection, agent install or setup step failing, evicted or lost pod).
  # Runs with scores, Tier 1/2 rejections and agent failures are never retried. 0 disables.
  # Needs controller image 0.4.1 or newer; older images exit on the unknown flag.
  maxRetries: 1
  # Create SkillEvals in phase Planned and no Jobs.
  dryRun: false
  # --preinstalled-agents: agent@version pins in the sandbox image of this release (a fact of the
  # image, not a policy). An entry on another agentVersion installs the CLI with npm, so the
  # SkillCIConfig network.agentInstallHosts are added to none and allowlist. Keep it in step with
  # controller.sandboxImage. Needs controller image 0.10.0 or newer.
  preinstalledAgents: [claude-code@2.1.292, codex@0.161.0, opencode@1.19.1]
  # Removed in 0.10.0 and ignored: controller.defaultSandboxProfile and controller.network moved to the
  # SkillCIConfig `default` (config.* below seeds it). NOTES.txt warns when they are still set.
  leaderElect: false
  # controller-runtime zap logging flags. Empty means the controller default.
  logging:
    level: ""
    encoder: ""
    development: false

# Platform settings: the SkillCIConfig `default` in the controller namespace (CONTRACT.md "SkillCIConfig").
# The controller reads it whenever it resolves a run, so edits apply without a restart. The chart creates
# it only when it does not exist yet (helm lookup), with helm.sh/resource-policy: keep; after that the
# object belongs to you: kubectl -n <namespace> edit scc default, or manage it with GitOps. Changing the
# values below after the first install has no effect on an existing object. Without the object the
# controller uses the same built-in defaults. Needs controller image 0.10.0 or newer.
config:
  # Seed the SkillCIConfig default. false: create it yourself (or run on the built-in defaults).
  create: true
  # SandboxProfile of a model list entry without sandboxProfile. When it does not exist, runs start a
  # bare Sandbox per trial.
  defaultSandboxProfile: default
  # Network modes of the trial sandboxes (CONTRACT.md "Network modes"). A skill declares
  # skillci.dev/network (none, allowlist, full) and skillci.dev/network-allow in its SKILL.md metadata,
  # which become OCI manifest annotations of the pushed digest.
  network:
    # Mode of a skill that declares none. full: the internet, never the cluster.
    default: full
    # Modes a skill may declare; another mode fails the run. Must contain default.
    modes: [none, allowlist, full]
    # auto (CiliumNetworkPolicies when the ciliumnetworkpolicies.cilium.io CRD exists), cilium
    # (require it) or off (no policies, every mode unenforced).
    enforcement: auto
    # Hosts added to none and allowlist, for example a proxy.
    alwaysAllow: []
    # Host bundles a skill names as @<name>. A map, so values merge with these defaults; set a bundle
    # to null to drop it. The object holds exactly the resulting bundles.
    bundles:
      apt: [deb.debian.org, security.debian.org]
      github: [github.com, api.github.com, codeload.github.com, objects.githubusercontent.com]
      node: [registry.npmjs.org]
      python: [pypi.org, files.pythonhosted.org]
    # Hosts added to none and allowlist when an entry's agent version is not preinstalled.
    agentInstallHosts: [registry.npmjs.org]
  # Network flows of the trials (CONTRACT.md "Trial bundles"). Runner pods have no egress policy, so they
  # reach the relay on any cluster.
  observability:
    # host:port of a Hubble Relay, passed to runner Jobs as HUBBLE_SERVER, for example
    # hubble-relay.kube-system.svc.cluster.local:80 (Cilium with Hubble Relay, as on DOKS). Empty collects
    # no flows. infra/ and deploy/install.sh set it when they find Hubble Relay. Controller 0.10.1 and
    # older ignore it.
    hubbleRelay: ""
  # The LLM judge that scores every trial, whatever agent is under test (CONTRACT.md "SkillCIConfig").
  # Its host is allowed in the network modes none and allowlist. Controller 0.10.1 and older ignore it.
  judge:
    # anthropic, openai, openai-compatible (needs baseURL) or nv_build. The runner pairs openai and nv_build
    # with claude-code and codex, openai-compatible with claude-code, opencode only with anthropic
    # (docs/agents-and-models.md "The judge").
    provider: anthropic
    # Empty: SkillEvaluator's default model of the provider.
    model: ""
    # API root, for example https://llm.example.com/v1. Required for openai-compatible, optional for
    # anthropic and openai, not allowed for nv_build.
    baseURL: ""
    # Key of the llm-keys Secret that holds the judge's API key (SKILL_EVAL_LLM_API_KEY of the runner).
    secretKey: anthropic

# SandboxProfiles the chart seeds in the controller namespace, name -> spec (CONTRACT.md
# "SandboxProfile"). The controller keeps a SandboxTemplate and a SandboxWarmPool (Agent Sandbox
# extensions) for each. Rendered only with a chart that ships the SandboxProfile CRD. Like the
# SkillCIConfig, each profile is created only when it does not exist yet and then belongs to you
# (kubectl -n <namespace> edit sbp default); later value changes do not touch it. create: false (or
# null) skips a profile; more profiles can be added here or with kubectl.
sandboxProfiles:
  default:
    create: true
    # Empty: the controller's --sandbox-image (controller.sandboxImage).
    image: ""
    # Memory is request and limit, CPU a request only.
    resources:
      cpu: "1"
      memory: 2Gi
    # Warm trial pods kept running and unclaimed; 0 cold-starts every trial (about 1 s).
    warmPool:
      replicas: 2

# Container and Service ports. They also set --webhook-addr and --metrics-addr.
ports:
  webhook: 8080
  metrics: 8081
  # Reporting website, see reports.enabled.
  reports: 8082

# Read-only reporting website served by the controller (--reports-addr): runs, release
# channels, policy decisions and the stored SkillEvaluator reports. Needs controller
# image 0.3.0 or newer, older images exit on the unknown flag.
reports:
  enabled: true

# Additional raw arguments, for example ["--zap-stacktrace-level=error"].
extraArgs: []
# Additional container env entries.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Secrets are referenced by name and never created unless create=true (demos and tests).
# Create them out of band: kubectl, Pulumi ESC, External Secrets or sealed-secrets.
secrets:
  # Harbor REST API credentials of the controller (robot account or admin).
  harborCredentials:
    existingSecret: harbor-credentials
    usernameKey: username
    passwordKey: password
    create: false
    username: ""
    password: ""
  # Bearer token the Harbor webhook policy sends.
  harborWebhook:
    existingSecret: harbor-webhook
    tokenKey: token
    # With optional=true a missing Secret leaves WEBHOOK_TOKEN empty and the
    # controller accepts every webhook (with a warning).
    optional: true
    create: false
    token: ""
  # LLM API keys used by runner Jobs. The controller hardcodes the name llm-keys in the
  # Jobs it creates, so the chart only documents it and can create it; changing the name
  # has no effect on the Jobs. Secret keys (all but anthropic are optional):
  #   anthropic        the judge, and the model of Claude Code and of OpenCode's anthropic/... models
  #   openai           Codex (OPENAI_API_KEY) and Tier 2 embeddings
  #   openai-base-url  OPENAI_BASE_URL for Codex; the runner uses https://api.openai.com/v1 without it
  #   ollama           OpenCode models "ollama-cloud/<model>" (Ollama Cloud, OpenAI-compatible)
  #   openrouter       OpenCode models "openrouter/<model>"
  #   nvidia           OpenCode models "nvidia/<model>" (NVIDIA Build), and Tier 2 embeddings when
  #                    there is no openai key
  llmKeys:
    existingSecret: llm-keys
    create: false
    anthropic: ""
    openai: ""
    openaiBaseUrl: ""
    nvidia: ""
    ollama: ""
    openrouter: ""

# Runner Jobs ServiceAccount, Role and RoleBinding. The controller hardcodes
# the ServiceAccount name skill-eval-runner.
runner:
  enabled: true
  serviceAccount:
    name: skill-eval-runner
    annotations: {}
  # A Secret the runner may read. Empty (the default) adds no rule. Needed only when you let
  # the trials build task images in a registry of your own (runner env TASK_IMAGE_REGISTRY and
  # TASK_IMAGE_PULL_SECRET): Harbor reads that registry's credentials from the Secret.
  pullSecretName: ""
  extraRules: []

service:
  type: ClusterIP
  webhookPort: 8080
  metricsPort: 8081
  reportsPort: 8082
  annotations: {}
  labels: {}

serviceMonitor:
  # Needs the Prometheus Operator CRDs. Do not enable while another ServiceMonitor
  # selects this Service, or the metrics are scraped twice.
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  # Extra labels, for example {release: kps} for a kube-prometheus-stack selector.
  labels: {}
  interval: 15s
  scrapeTimeout: ""
  path: /metrics
  relabelings: []
  metricRelabelings: []

# Push the skillci_* metrics over OTLP (OpenTelemetry) as well, next to the /metrics scrape:
# same names, labels and values. Off while endpoint is empty. Needs controller image 0.8.0 or newer.
otlp:
  # host:port, or a URL (http:// turns TLS off). Examples: otel-collector.monitoring:4318 (an
  # OpenTelemetry Collector or Grafana Alloy), kps-kube-prometheus-stack-prometheus.monitoring:9090
  # with urlPath below (the Prometheus OTLP receiver).
  endpoint: ""
  # http/protobuf or grpc.
  protocol: http/protobuf
  # Full OTLP/HTTP metrics path. /api/v1/otlp/v1/metrics for the Prometheus OTLP receiver; empty
  # is the standard /v1/metrics.
  urlPath: ""
  # Plain HTTP or gRPC without TLS, for a receiver inside the cluster.
  insecure: false
  # Time between exports, for example 30s. Empty keeps the SDK default (60s).
  interval: ""
  # Headers sent with every export, comma separated key=value. For an API or ingest key use
  # headersSecret instead, so the key stays out of the values and the pod arguments.
  headers: ""
  # A Secret key that holds the headers (OTEL_EXPORTER_OTLP_HEADERS), for example
  # "x-honeycomb-team=<ingest key>". Takes the place of headers when name is set.
  headersSecret:
    name: ""
    key: headers
  # Resource attributes added to k8s.pod.name and k8s.namespace.name, which are always set.
  resourceAttributes: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Probes are served by the webhook server on the webhook port.
livenessProbe:
  httpGet:
    path: /healthz
    port: webhook
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: webhook
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
