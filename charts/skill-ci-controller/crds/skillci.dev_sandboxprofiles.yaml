---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sandboxprofiles.skillci.dev
spec:
  group: skillci.dev
  names:
    kind: SandboxProfile
    listKind: SandboxProfileList
    plural: sandboxprofiles
    shortNames:
    - sbp
    singular: sandboxprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.resources.cpu
      name: CPU
      type: string
    - jsonPath: .spec.resources.memory
      name: Memory
      type: string
    - jsonPath: .spec.warmPool.replicas
      name: Warm
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SandboxProfile is the kind of trial sandbox a model list entry runs in: the
          image, the size and a warm pool of pre-started pods. The controller keeps a
          SandboxTemplate and a SandboxWarmPool (Agent Sandbox extensions) of the same
          name for it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: SandboxProfileSpec describes the trial sandboxes of the runs
              that use the profile.
            properties:
              image:
                description: Image is the sandbox image. Empty means the controller's
                  --sandbox-image.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector constrains the nodes trial pods run on.
                type: object
              resources:
                default: {}
                description: Resources is the size of one trial sandbox.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    default: "1"
                    description: CPU is the CPU request of the sandbox container.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 2Gi
                    description: Memory is the memory request and limit of the sandbox
                      container.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              runtimeClassName:
                description: RuntimeClassName is the RuntimeClass of the trial pods,
                  for example gvisor.
                type: string
              tolerations:
                description: Tolerations of the trial pods.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              warmPool:
                default: {}
                description: WarmPool sizes the pool of pre-started trial pods.
                properties:
                  replicas:
                    default: 2
                    description: |-
                      Replicas is the number of warm trial pods. Zero keeps none: every trial
                      cold-starts a pod from the template.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
            type: object
          status:
            description: SandboxProfileStatus is the observed state of a SandboxProfile.
            properties:
              conditions:
                description: Conditions holds Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              readyReplicas:
                description: ReadyReplicas is the number of warm trial pods that are
                  ready.
                format: int32
                type: integer
              templateName:
                description: TemplateName is the SandboxTemplate the controller keeps
                  for the profile.
                type: string
              warmPoolName:
                description: |-
                  WarmPoolName is the SandboxWarmPool the runner claims trial pods from
                  (SANDBOX_WARM_POOL of the runner Job). Empty while the Agent Sandbox
                  extensions are not installed: runs then start a bare Sandbox per trial.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
