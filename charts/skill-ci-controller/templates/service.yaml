apiVersion: v1
kind: Service
metadata:
  name: {{ include "skill-ci-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skill-ci-controller.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "skill-ci-controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.service.webhookPort }}
      targetPort: webhook
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
    {{- if .Values.reports.enabled }}
    - name: reports
      port: {{ .Values.service.reportsPort }}
      targetPort: reports
    {{- end }}
