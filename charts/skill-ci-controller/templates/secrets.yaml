{{- /*
Secrets are only created when explicitly asked for (secrets.<name>.create=true),
which is meant for tests and demos. In real installs create them out of band
(ESC, External Secrets, sealed-secrets, kubectl) and reference them by name.
*/ -}}
{{- with .Values.secrets.harborCredentials }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "skill-ci-controller.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .usernameKey }}: {{ required "secrets.harborCredentials.username is required when create=true" .username | quote }}
  {{ .passwordKey }}: {{ required "secrets.harborCredentials.password is required when create=true" .password | quote }}
{{- end }}
{{- end }}
{{- with .Values.secrets.harborWebhook }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "skill-ci-controller.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .tokenKey }}: {{ required "secrets.harborWebhook.token is required when create=true" .token | quote }}
{{- end }}
{{- end }}
{{- with .Values.secrets.llmKeys }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "skill-ci-controller.labels" $ | nindent 4 }}
type: Opaque
stringData:
  anthropic: {{ required "secrets.llmKeys.anthropic is required when create=true" .anthropic | quote }}
  {{- range $key, $value := dict "openai" .openai "openai-base-url" .openaiBaseUrl "nvidia" .nvidia "ollama" .ollama "openrouter" .openrouter }}
  {{- with $value }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
