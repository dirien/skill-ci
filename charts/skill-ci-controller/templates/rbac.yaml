{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skill-ci-controller.fullname" . }}
  namespace: {{ include "skill-ci-controller.watchNamespace" . }}
  labels:
    {{- include "skill-ci-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["skillci.dev"]
    resources: ["skillevals"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["skillci.dev"]
    resources: ["skillevals/status"]
    verbs: ["get", "update", "patch"]
  # Needed to set blockOwnerDeletion on the Jobs it owns.
  - apiGroups: ["skillci.dev"]
    resources: ["skillevals/finalizers"]
    verbs: ["update"]
  # SandboxProfiles: the controller reads them and writes their status.
  - apiGroups: ["skillci.dev"]
    resources: ["sandboxprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["skillci.dev"]
    resources: ["sandboxprofiles/status"]
    verbs: ["get", "update", "patch"]
  # Needed to set blockOwnerDeletion on the templates and warm pools it owns.
  - apiGroups: ["skillci.dev"]
    resources: ["sandboxprofiles/finalizers"]
    verbs: ["update"]
  # SkillCIConfigs: the controller reads the platform settings and writes their status.
  - apiGroups: ["skillci.dev"]
    resources: ["skillciconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["skillci.dev"]
    resources: ["skillciconfigs/status"]
    verbs: ["get", "update", "patch"]
  # The SandboxTemplate and SandboxWarmPool of every SandboxProfile (Agent Sandbox extensions).
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools/status"]
    verbs: ["get"]
  # Network modes: the baseline policy and one policy per SkillEval.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # llm-keys only: openai-base-url decides the model host of Codex runs with network none or allowlist, and the
  # reporting site redacts every key value from the sessions it renders.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.llmKeys.existingSecret | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The model list: read it, and record the last-applied copy in an annotation.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Only used with --leader-elect.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skill-ci-controller.fullname" . }}
  namespace: {{ include "skill-ci-controller.watchNamespace" . }}
  labels:
    {{- include "skill-ci-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skill-ci-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "skill-ci-controller.fullname" . }}
---
# Read CustomResourceDefinitions: whether Cilium and the Agent Sandbox extensions are installed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skill-ci-controller.fullname" . }}-crds-{{ .Release.Namespace }}
  labels:
    {{- include "skill-ci-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skill-ci-controller.fullname" . }}-crds-{{ .Release.Namespace }}
  labels:
    {{- include "skill-ci-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skill-ci-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skill-ci-controller.fullname" . }}-crds-{{ .Release.Namespace }}
{{- end }}
